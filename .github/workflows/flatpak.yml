name: Build Flatpak

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.catoblepa.signature-viewer.json
          bundle: io.github.catoblepa.signature-viewer.flatpak

      - name: Upload Flatpak bundle as artifact
        uses: actions/upload-artifact@v5
        with:
          name: signature-viewer-flatpak
          path: io.github.catoblepa.signature-viewer.flatpak

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: io.github.catoblepa.signature-viewer.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
